<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 584 260">
  <defs>
    <linearGradient id="gradLensBS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#6ee7b7"/>
    </linearGradient>
    <filter id="lupaGlowBS" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- "Carro" bold branco -->
  <text x="4" y="138"
    font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif"
    font-size="120" font-weight="800" fill="white" letter-spacing="-4">Carro</text>

  <!-- "Lens" leve verde accent -->
  <text x="336" y="138"
    font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif"
    font-size="120" font-weight="300" fill="url(#gradLensBS)" letter-spacing="-2">Lens</text>

  <!-- Lupa branca -->
  <g filter="url(#lupaGlowBS)">
    <circle cx="348" cy="68" r="34" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="5.5"/>
    <circle cx="348" cy="68" r="29" fill="white" opacity="0.07"/>
    <line x1="374" y1="94" x2="396" y2="116" stroke="rgba(255,255,255,0.9)" stroke-width="5.5" stroke-linecap="round"/>
    <ellipse cx="338" cy="56" rx="9" ry="5" fill="white" opacity="0.25" transform="rotate(-30,338,56)"/>
  </g>

  <!-- Ponto separador verde -->
  <circle cx="322" cy="126" r="5" fill="#34d399" opacity="1"/>

  <!-- Linha accent verde -->
  <rect x="4" y="162" width="95" height="3" rx="1.5" fill="#34d399"/>
  <rect x="106" y="162" width="32" height="3" rx="1.5" fill="#34d399" opacity="0.4"/>

  <!-- Subtitulo -->
  <text x="4" y="215"
    font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif"
    font-size="22" font-weight="500" fill="rgba(255,255,255,0.5)" letter-spacing="10">INTELIGÊNCIA AUTOMOTIVA</text>
</svg>
